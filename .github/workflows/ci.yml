name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

# Actions are pinned to commit SHAs (not mutable tags) so a retagged or
# compromised action version cannot silently enter the pipeline. The
# trailing comment records the human-readable version each SHA corresponds to.
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # --locked-mode fails the build if the committed packages.lock.json files
      # would change, making restores reproducible and tamper-evident.
      - name: Restore
        run: dotnet restore --locked-mode

      - name: Restore tools
        run: dotnet tool restore

      - name: Format check
        run: dotnet csharpier check .

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      # Fail the build on any known-vulnerable package (direct or transitive).
      - name: Vulnerability scan
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qiE '\b(Critical|High|Moderate|Low)\b' vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages detected (see log above)."
            exit 1
          fi

  pack-and-publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      id-token: write # NuGet OIDC trusted publishing
      contents: read

    steps:
      - uses: andregoepel/workflows/.github/actions/nuget-publish@main
        with:
          pack-projects: |
            src/AndreGoepel.Testing.Bunit/AndreGoepel.Testing.Bunit.csproj
            src/AndreGoepel.Testing.E2E/AndreGoepel.Testing.E2E.csproj
          nuget-user: ${{ secrets.NUGET_USER }}
